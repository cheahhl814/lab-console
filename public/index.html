<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HTML Terminal</title>
    <link rel="stylesheet" href="/node_modules/xterm/css/xterm.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="container">
        <!-- App toolbar (replaces file-browser-header as global chrome) -->
        <div id="app-toolbar">
            <div id="app-toolbar-left">
                <button id="home-btn" class="icon-btn" title="Home (~/)" aria-label="Home">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-home"/></svg>
                </button>
                <!-- Up button — navigate to parent directory. Primary nav action lives in toolbar, not in the list. -->
                <button id="up-btn" class="icon-btn terminal-only" title="Back to parent directory" aria-label="Back to parent directory">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-up"/></svg>
                </button>
                <!-- Breadcrumb replaces the static 'Web Terminal' title.
                     The text is updated by the /files OOB span just like the legacy header. -->
                <span id="app-title">File Browser: <span id="file-browser-header-text">~/.</span></span>

                <!-- Font-size stepper — visible only in terminal-only mode (left cluster was empty). -->
                <button id="font-decrease-btn" class="icon-btn terminal-only" title="Decrease font size" aria-label="Decrease font size">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-font-minus"/></svg>
                </button>
                <button id="font-increase-btn" class="icon-btn terminal-only" title="Increase font size" aria-label="Increase font size">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-font-plus"/></svg>
                </button>
            </div>
            <div id="app-toolbar-right">
                <!-- File actions, view modes, theme, terminal — all clustered on the right. -->
                <button id="upload-btn" class="icon-btn" title="Upload File" aria-label="Upload">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-upload"/></svg>
                </button>
                <button id="new-folder-btn" class="icon-btn" title="New Folder" aria-label="New Folder">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-folder"/></svg>
                </button>
                <button id="show-hidden-btn" class="icon-btn" title="Show Hidden Files" aria-pressed="false" aria-label="Toggle hidden files">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-eye"/></svg>
                </button>

                <button id="view-mode-list"    class="view-mode-btn active" data-view="list"    title="List view" aria-label="List view">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-view-list"/></svg>
                </button>
                <button id="view-mode-grid"    class="view-mode-btn"         data-view="grid"    title="Grid view" aria-label="Grid view">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-view-grid"/></svg>
                </button>
                <button id="view-mode-details" class="view-mode-btn"         data-view="details" title="Details view" aria-label="Details view">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-view-details"/></svg>
                </button>

                <!-- Theme picker — button that opens a dropdown menu on click (replaces <select>) -->
                <div id="theme-menu-wrapper">
                    <button id="theme-menu-btn" class="icon-btn" title="Theme" aria-haspopup="true" aria-expanded="false" aria-label="Theme">
                        <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-theme"/></svg>
                    </button>
                    <div id="theme-menu" class="hidden" role="menu"></div>
                </div>

                <!-- Terminal-only-mode extras (hidden in file-browser mode). -->
                <button id="notify-btn" class="icon-btn terminal-only" title="Notify when shell returns to prompt" aria-pressed="false" aria-label="Toggle job notifications">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-bell"/></svg>
                </button>
                <button id="copy-session-btn" class="icon-btn terminal-only" title="Copy session info" aria-label="Copy session info">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-copy"/></svg>
                </button>

                <!-- Terminal open modes — single button with dropdown (side panel OR new tab). -->
                <div id="terminal-menu-wrapper">
                    <button id="terminal-menu-btn" class="icon-btn" title="Open terminal" aria-haspopup="true" aria-expanded="false" aria-label="Terminal">
                        <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-terminal"/></svg>
                    </button>
                    <div id="terminal-menu" class="hidden" role="menu">
                        <div class="menu-item" data-terminal-action="side-panel">Side Panel</div>
                        <div class="menu-item" data-terminal-action="new-tab">New Browser Tab</div>
                    </div>
                </div>

                <!-- Back to file browser button — visible only in terminal-only mode. -->
                <button id="back-to-browser-btn" class="icon-btn hidden" title="Back to File Browser" aria-label="Back to file browser">
                    <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-back"/></svg>
                </button>
            </div>
        </div>

        <div id="surface-area">
            <section class="surface" id="file-browser-surface" data-surface="files">
                <div id="file-browser">
                    <input type="hidden" id="current-path" value=".">
                    <input type="file" id="file-input" class="hidden" multiple />
                <ul id="file-list"
                    hx-get="/files"
                    hx-vals="js:{path: document.getElementById('current-path').value, view: window.__fileListView || 'list'}"
                    hx-trigger="load, file-list-changed from:body"
                    hx-include="#show-hidden-checkbox"
                    hx-swap="innerHTML"></ul>
                </div>
            </section>

            <section class="surface" id="terminal-surface" data-surface="terminal">
                <div id="terminal-container">
                    <div id="tab-bar">
                        <button id="new-tab-btn">+</button>
                    </div>
                    <div id="terminal-views"></div>
                    <!-- Close button anchored inside the terminal panel — slides it back out. -->
                    <button id="close-terminal-btn" class="icon-btn" title="Hide terminal panel" aria-label="Hide terminal panel">
                        <svg class="icon-svg" aria-hidden="true"><use href="icons.svg#icon-close-pane"/></svg>
                    </button>
                </div>
            </section>
        </div>
    </div>
            
            <div id="status-bar" hx-get="/system-stats" hx-trigger="load, every 5s" hx-swap="none">
                <div class="stat" id="version-stat">
                    <span class="label">Version:</span>
                    <span class="value" id="version-stat-value"></span>
                </div>
                <div class="stat" id="cpu-stat">
                    <span class="label">CPU:</span>
                    <span class="value" id="cpu-stat-value">0%</span>
                </div>
                <div class="stat" id="ram-stat">
                    <span class="label">RAM:</span>
                    <span class="value" id="ram-stat-value">0%</span>
                </div>
                <div class="stat" id="gpu-stat">
                    <span class="label">GPU:</span>
                    <span class="value" id="gpu-stat-value">N/A</span>
                </div>
            </div>
            
            <div id="context-menu" class="hidden">
    <div id="context-menu-item-copy">Copy</div>
    <div id="context-menu-item-cut">Cut</div>
    <div id="context-menu-item-paste">Paste</div>
    <div id="context-menu-item-duplicate">Duplicate</div>
    <div id="context-menu-item-download">Download</div>
    <div id="context-menu-item-rename">Rename</div>
    <div id="context-menu-item-delete">Delete</div>
    <div id="context-menu-item-new-file">New File</div>
    <div id="context-menu-item-new-folder">New Folder</div>
    <div id="context-menu-item-upload">Upload File</div>
    <div id="context-menu-item-open-with-monaco">Open with Monaco</div>
</div>



<!-- 3rd party libraries -->
<script src="https://unpkg.com/split.js/dist/split.min.js"></script>

<!-- App scripts -->
    <script src="/node_modules/xterm/lib/xterm.js"></script>    <script src="/node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
    <script src="vendor/htmx.min.js"></script>
    <script src="main.js"></script>


</body>
</html>

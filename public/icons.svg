<?xml version="1.0" encoding="UTF-8"?>
<!--
  Toolbar icon sprite — single file referenced via <use href="icons.svg#name">.
  ponytail: monochrome, stroke=currentColor, no fill. 24x24 viewBox. Stroke-width 2.
  Generated 2026-08-30 per claude-htmx icon design review.
  Design rules:
    - All shapes use stroke="currentColor" fill="none" (except where noted).
    - stroke-linecap="round" and stroke-linejoin="round" for crisp 16px rendering.
    - Padding: ~2px on each side so 24px shapes don't crash into button borders.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <style>
      .icon-stroke { stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- home: pentagon roof + rectangle base -->
  <symbol id="icon-home" viewBox="0 0 24 24">
    <path class="icon-stroke" d="M3 12 L12 4 L21 12 M5 10 V20 H19 V10" />
  </symbol>

  <!-- upload: arrow up + horizontal tray line -->
  <symbol id="icon-upload" viewBox="0 0 24 24">
    <path class="icon-stroke" d="M12 4 V16 M7 9 L12 4 L17 9 M4 20 H20" />
  </symbol>

  <!-- folder: tab-top rectangle + small + badge bottom-right -->
  <symbol id="icon-folder" viewBox="0 0 24 24">
    <path class="icon-stroke" d="M3 7 V18 H21 V8 H12 L10 6 H3 Z" />
    <path class="icon-stroke" d="M17 13 V17 M15 15 H19" />
  </symbol>

  <!-- eye: almond + pupil -->
  <symbol id="icon-eye" viewBox="0 0 24 24">
    <path class="icon-stroke" d="M2 12 C5 6, 9 5, 12 5 C15 5, 19 6, 22 12 C19 18, 15 19, 12 19 C9 19, 5 18, 2 12 Z" />
    <circle class="icon-stroke" cx="12" cy="12" r="3" />
  </symbol>

  <!-- view-list: three horizontal lines -->
  <symbol id="icon-view-list" viewBox="0 0 24 24">
    <path class="icon-stroke" d="M4 6 H20 M4 12 H20 M4 18 H20" />
  </symbol>

  <!-- view-grid: 2x2 squares with gaps -->
  <symbol id="icon-view-grid" viewBox="0 0 24 24">
    <rect class="icon-stroke" x="4" y="4" width="7" height="7" rx="1" />
    <rect class="icon-stroke" x="13" y="4" width="7" height="7" rx="1" />
    <rect class="icon-stroke" x="4" y="13" width="7" height="7" rx="1" />
    <rect class="icon-stroke" x="13" y="13" width="7" height="7" rx="1" />
  </symbol>

  <!-- view-details: table-with-header (rectangle + 1 horizontal line + 2 vertical dividers below) -->
  <symbol id="icon-view-details" viewBox="0 0 24 24">
    <rect class="icon-stroke" x="3" y="4" width="18" height="16" rx="1" />
    <path class="icon-stroke" d="M3 9 H21 M9 9 V20 M15 9 V20" />
  </symbol>

  <!-- theme: half-filled circle (left half filled, right half outline) -->
  <symbol id="icon-theme" viewBox="0 0 24 24">
    <circle class="icon-stroke" cx="12" cy="12" r="9" />
    <path d="M12 3 A9 9 0 0 0 12 21 Z" fill="currentColor" />
  </symbol>

  <!-- terminal: > chevron + underscore bar -->
  <symbol id="icon-terminal" viewBox="0 0 24 24">
    <path class="icon-stroke" d="M5 8 L10 12 L5 16 M13 16 H19" />
  </symbol>
</svg>